<!DOCTYPE html>
<html>
<head>
    <title>Главная страница</title>

    <style>
        .light-find-box {
            box-sizing: border-box;
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .light-find-box:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.16);
        }

        @keyframes spinner {
            0% {
                transform: scale(.1) rotate(0deg);
                fill: currentColor;
            }

            33% {
                transform: scale(1) rotate(150deg);
                fill: transparent;
            }

            66% {
                transform: scale(1) rotate(210deg);
                fill: transparent;
            }

            100% {
                transform: scale(.1) rotate(360deg);
                fill: currentColor;
            }
        }

        .spinner {
            animation: spinner 1.5s infinite linear;
            color: rgb(6, 75, 67);
        }

        .worker-demo {
            margin-top: 32px;
        }
    </style>
</head>
<body>
    <h1>JavaScript</h1>

    <section class="worker-demo">
        <h2>Service Worker</h2>
        <button id="start">Start!</button>
        <button id="unregister-service-worker">Unregister Service Worker</button>

        <div>
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="56" fill="none" class="spinner">
                <path stroke="currentColor" stroke-width="4" d="M3.464 30a4 4 0 0 1 0-4L16 4.287a4 4 0 0 1 3.464-2h25.072a4 4 0 0 1 3.464 2L60.536 26a4 4 0 0 1 0 4L48 51.713a4 4 0 0 1-3.464 2H19.464a4 4 0 0 1-3.464-2L3.464 30Z"/>
            </svg>
        </div>

        <div id="result"></div>
    </section>

    <script>
        let loadedComponents = 0;
        let serviceWorker = null;

        const startButton = document.getElementById('start');
        const unregisterServiceWorkerButton = document.getElementById('unregister-service-worker');
        const result = document.getElementById('result');

        const serviceWorkerContract = {
            getResult: 'GET_RESULT',
            recalculateResult: 'RECALCULATE_RESULT',
            result: 'RESULT',
            error: 'ERROR',
        };

        const renderApp = () => {
            const card = document.createElement('my-card');
            const select = document.createElement('my-select');

            card.setAttribute('header', 'Custom MultiSelect');
            card.setAttribute('sub-header', 'Выберите несколько опций');

            select.innerHTML = `
                <div slot="search">
                    <input class="light-find-box" placeholder="Поиск...">
                </div>

                <option value="opt1">Option 1</option>
                <option value="opt2">Option 2</option>
                <option value="opt3">Option 3</option>
            `;

            card.append(select);
            document.body.append(card);
        };

        const getServiceWorker = async (scriptURL, options) => {
            if (!('serviceWorker' in navigator)) {
                result.textContent = 'Ваш браузер не поддерживает Service Workers';
                return null;
            }

            try {
                let registration = await navigator.serviceWorker.getRegistration();

                if (!registration) {
                    registration = await navigator.serviceWorker.register(scriptURL, options);
                }

                registration = await navigator.serviceWorker.ready;

                return {
                    registration,
                    container: navigator.serviceWorker,
                    controller: registration.active,
                    addEventListener: navigator.serviceWorker.addEventListener.bind(navigator.serviceWorker),
                    postMessage: registration.active.postMessage.bind(registration.active),
                };
            } catch (error) {
                result.textContent = 'Не удалось зарегистрировать сервис-воркер';
                console.error(`Registration failed with ${error}`);
                return null;
            }
        };

        startButton.addEventListener('click', () => {
            if (!serviceWorker) {
                result.textContent = 'Сервис-воркер еще не готов';
                return;
            }

            result.textContent = 'Вычисление запущено...';

            serviceWorker.postMessage({
                type: serviceWorkerContract.recalculateResult,
                payload: {
                    timeout: 3000,
                },
            });
        });

        unregisterServiceWorkerButton.addEventListener('click', async () => {
            const registration = await navigator.serviceWorker.getRegistration();

            if (!registration) {
                result.textContent = 'Сервис-воркер не зарегистрирован';
                return;
            }

            await registration.unregister();
            serviceWorker = null;
            result.textContent = 'Сервис-воркер удален';
        });

        (async () => {
            serviceWorker = await getServiceWorker('./thread.js', { scope: './' });

            if (!serviceWorker) {
                return;
            }

            serviceWorker.addEventListener('message', (evt) => {
                const { type, payload } = evt.data;

                if (type === serviceWorkerContract.result) {
                    result.textContent = payload.result;
                }

                if (type === serviceWorkerContract.error) {
                    result.textContent = payload.message;
                }
            });

            serviceWorker.postMessage({
                type: serviceWorkerContract.getResult,
                payload: {
                    timeout: 3000,
                },
            });
        })();

        const onLoad = () => {
            loadedComponents += 1;

            if (loadedComponents === components.length) {
                renderApp();
            }
        };

        const onError = (err) => {
            console.error('Ошибка загрузки веб-компонента:', err);
        };

        const components = ['my-card', 'my-select'];

        components.forEach((component) => {
            const script = document.createElement('script');

            script.src = `./${component}.js`;
            script.dataset.name = component;
            script.defer = true;

            script.addEventListener('load', onLoad);
            script.addEventListener('error', onError);

            document.body.append(script);
        });
    </script>
</body>
</html>
